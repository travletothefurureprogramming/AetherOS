<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>AetherOS Dashboard</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background: #141414;
            color: #d1d5db;
            margin: 0;
            padding: 24px;
        }
        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #262626;
            padding-bottom: 16px;
            margin-bottom: 24px;
            max-width: 900px;
            margin-left: auto;
            margin-right: auto;
        }
        h1 {
            font-size: 14px;
            font-weight: 600;
            letter-spacing: 0.05em;
            color: #f3f4f6;
            margin: 0;
            text-transform: uppercase;
        }
        #status {
            font-size: 12px;
            color: #9ca3af;
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
            gap: 12px;
            max-width: 900px;
            margin: 0 auto;
        }
        .card {
            background: #1a1a1a;
            border: 1px solid #262626;
            padding: 16px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        .device-name {
            font-size: 13px;
            font-weight: 600;
            color: #f3f4f6;
            margin-bottom: 4px;
        }
        .device-meta {
            font-size: 11px;
            color: #6b7280;
            margin-bottom: 12px;
        }
        .controls {
            display: flex;
            gap: 6px;
            margin-bottom: 8px;
        }
        button {
            background: #262626;
            color: #e5e7eb;
            border: 1px solid #333333;
            padding: 6px 12px;
            font-size: 11px;
            font-weight: 500;
            cursor: pointer;
            flex: 1;
        }
        button:hover {
            background: #333333;
            border-color: #404040;
        }
        select {
            background: #262626;
            color: #e5e7eb;
            border: 1px solid #333333;
            padding: 6px;
            font-size: 11px;
            width: 100%;
            margin-bottom: 8px;
        }
        input[type=range] {
            width: 100%;
            margin-top: 8px;
            accent-color: #737373;
            background: #262626;
        }
        .temp-picker {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-top: 6px;
            font-size: 11px;
            color: #9ca3af;
        }
        .temp-picker input {
            width: 50px;
            background: #262626;
            border: 1px solid #333333;
            color: #f3f4f6;
            padding: 4px;
            text-align: center;
            font-size: 11px;
        }
        .warning-text {
            font-size: 10px;
            color: #ef4444;
            margin-top: 4px;
        }
        .empty {
            text-align: center;
            color: #6b7280;
            font-size: 12px;
            grid-column: 1 / -1;
            padding: 40px;
        }
    </style>
</head>
<body>

    <header>
        <h1>AetherOS Hub</h1>
        <div id="status">Φόρτωση...</div>
    </header>

    <div id="container" class="grid"></div>

    <script>
        async function loadDevices() {
            const container = document.getElementById('container');
            const status = document.getElementById('status');
            
            try {
                const res = await fetch('/api/devices');
                const devices = await res.json();

                status.innerText = `${devices.length} συσκευές`;
                container.innerHTML = '';

                if (devices.length === 0) {
                    container.innerHTML = '<div class="empty">Δεν βρέθηκαν καταχωρισμένες συσκευές.</div>';
                    return;
                }

                devices.forEach(d => {
                    const brand = (d.brand || '').toLowerCase();
                    const type = (d.device_type || '').toLowerCase();
                    const isTv = type.includes('tv') || brand === 'lg' || brand === 'samsung' || brand === "sony bravia";
                    const isAC = type.includes('daikin') || type.includes('ac') || brand === 'daikin';
                    const isPlug = type.includes('plug') || type.includes('p100') || type.includes('p110') || type.includes('p115');
                    const isRestricted = brand === 'shelly' || brand === 'phue' || type.includes('shelly') || type.includes('phue');
                    const showBrightness = !isTv && !isAC && !isPlug && !isRestricted;

                    const card = document.createElement('div');
                    card.className = 'card';

                    let html = `
                        <div>
                            <div class="device-name">${d.device_id}</div>
                            <div class="device-meta">${d.brand} / ${d.ip_address}</div>
                        </div>
                        <div>
                    `;

                    if (isTv) {
                        html += `
                            <div class="controls">
                                <button onclick="send('/api/tv/control', '${d.device_id}', '${d.device_type}', 'turn_on')">ON</button>
                                <button onclick="send('/api/tv/control', '${d.device_id}', '${d.device_type}', 'turn_off')">OFF</button>
                            </div>
                            <div class="controls">
                                <button onclick="send('/api/tv/control', '${d.device_id}', '${d.device_type}', 'play')">PLAY</button>
                                <button onclick="send('/api/tv/control', '${d.device_id}', '${d.device_type}', 'pause')">PAUSE</button>
                            </div>
                            <div class="controls">
                                <button onclick="send('/api/tv/control', '${d.device_id}', '${d.device_type}', 'volume_up')">VOL +</button>
                                <button onclick="send('/api/tv/control', '${d.device_id}', '${d.device_type}', 'volume_down')">VOL -</button>
                            </div>
                        `;
                    } else if (isAC) {
                        html += `
                            <div class="controls">
                                <button onclick="send('/api/air-condition/control', '${d.device_id}', '${d.device_type}', 'turn_on')">ON</button>
                                <button onclick="send('/api/air-condition/control', '${d.device_id}', '${d.device_type}', 'turn_off')">OFF</button>
                            </div>
                            <select onchange="send('/api/air-condition/control', '${d.device_id}', '${d.device_type}', 'set_mode', this.value)">
                                <option value="cool">Mode: Cool</option>
                                <option value="heat">Mode: Heat</option>
                                <option value="auto">Mode: Auto</option>
                                <option value="dry">Mode: Dry</option>
                                <option value="fan">Mode: Fan</option>
                            </select>
                            <div class="temp-picker">
                                <span>Θερμοκρασία (°C):</span>
                                <input type="number" min="16" max="32" value="24" 
                                    onchange="send('/api/air-condition/control', '${d.device_id}', '${d.device_type}', 'set_temperature', parseFloat(this.value))">
                            </div>
                            <div class="warning-text">* Unsupp: BRP069C4x fw 2.0.0</div>
                        `;
                    } else {
                        const endpoint = isPlug ? '/api/plug/control' : '/api/light/control';
                        html += `
                            <div class="controls">
                                <button onclick="send('${endpoint}', '${d.device_id}', '${d.device_type}', 'turn_on')">ON</button>
                                <button onclick="send('${endpoint}', '${d.device_id}', '${d.device_type}', 'turn_off')">OFF</button>
                            </div>
                        `;

                        if (showBrightness) {
                            html += `
                                <input type="range" min="1" max="100" value="80" 
                                    onchange="send('${endpoint}', '${d.device_id}', '${d.device_type}', 'set_brightness', parseInt(this.value))">
                            `;
                        }
                    }

                    html += `</div>`;
                    card.innerHTML = html;
                    container.appendChild(card);
                });

            } catch (err) {
                status.innerText = 'Σφάλμα σύνδεσης';
            }
        }

        async function send(endpoint, id, type, action, val = null) {
            await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    device_id: id,
                    dev_type: type,
                    action: action,
                    value: val,
                    triggered_by: 'dashboard'
                })
            });
        }

        loadDevices();
    </script>
</body>
</html>
