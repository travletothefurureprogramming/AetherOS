<!DOCTYPE html>
<html lang="el">
<head>
    <meta charset="UTF-8">
    <title>AetherOS Dashboard</title>
    <style>
    :root {
        --bg-main: #0a0a0a;
        --bg-card: #121212;
        --border-color: #222222;
        --border-hover: #3b3b3b;
        --text-main: #ededed;
        --text-muted: #737373;
        --accent: #ffffff;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg-main);
        color: var(--text-main);
        margin: 0;
        padding: 40px 24px;
        -webkit-font-smoothing: antialiased;
    }

    header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 20px;
        margin-bottom: 32px;
        max-width: 960px;
        margin-left: auto;
        margin-right: auto;
    }

    h1 {
        font-size: 13px;
        font-weight: 500;
        letter-spacing: 0.08em;
        color: var(--text-main);
        margin: 0;
        text-transform: uppercase;
    }

    #status {
        font-size: 12px;
        color: var(--text-muted);
        font-family: monospace;
    }

    .grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
        gap: 16px;
        max-width: 960px;
        margin: 0 auto;
    }

    .card {
        background: var(--bg-card);
        border: 1px solid var(--border-color);
        border-radius: 8px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        transition: border-color 0.2s ease, transform 0.2s ease;
    }

    .card:hover {
        border-color: var(--border-hover);
    }

    .device-name {
        font-size: 14px;
        font-weight: 500;
        color: var(--text-main);
        margin-bottom: 4px;
        letter-spacing: -0.01em;
    }

    .device-meta {
        font-size: 11px;
        color: var(--text-muted);
        margin-bottom: 16px;
        font-family: monospace;
    }

    .controls {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
    }

    button {
        background: #171717;
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 8px 12px;
        font-size: 11px;
        font-weight: 500;
        cursor: pointer;
        flex: 1;
        transition: background 0.15s ease, border-color 0.15s ease;
    }

    button:hover {
        background: #222222;
        border-color: var(--border-hover);
    }

    button:active {
        background: #2a2a2a;
    }

    select {
        background: #171717;
        color: var(--text-main);
        border: 1px solid var(--border-color);
        border-radius: 6px;
        padding: 8px;
        font-size: 11px;
        width: 100%;
        margin-bottom: 10px;
        outline: none;
        cursor: pointer;
    }

    select:focus {
        border-color: var(--border-hover);
    }

    input[type=range] {
        width: 100%;
        margin-top: 10px;
        accent-color: #ffffff;
        background: transparent;
        cursor: pointer;
    }

    .temp-picker {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin-top: 8px;
        font-size: 11px;
        color: var(--text-muted);
    }

    .temp-picker input {
        width: 50px;
        background: #171717;
        border: 1px solid var(--border-color);
        border-radius: 6px;
        color: var(--text-main);
        padding: 6px;
        text-align: center;
        font-size: 11px;
        outline: none;
    }

    .warning-text {
        font-size: 10px;
        color: #ef4444;
        margin-top: 8px;
        font-family: monospace;
    }

    .empty {
        text-align: center;
        color: var(--text-muted);
        font-size: 13px;
        grid-column: 1 / -1;
        padding: 60px;
        border: 1px dashed var(--border-color);
        border-radius: 8px;
    }
</style>
</head>
<body>

    <header>
        <h1>AetherOS Hub</h1>
        <div id="status">Φόρτωση...</div>
    </header>

    <div id="container" class="grid"></div>

    <script>
        async function loadDevices() {
            const container = document.getElementById('container');
            const status = document.getElementById('status');
            
            try {
                const res = await fetch('/api/devices');
                const devices = await res.json();

                status.innerText = `${devices.length} συσκευές`;
                container.innerHTML = '';

                if (devices.length === 0) {
                    container.innerHTML = '<div class="empty">Δεν βρέθηκαν καταχωρισμένες συσκευές.</div>';
                    return;
                }

                devices.forEach(d => {
                    const brand = (d.brand || '').toLowerCase();
                    const type = (d.device_type || '').toLowerCase();
                    const isTv = type.includes('tv') || brand === 'lg' || brand === 'samsung' || brand === "sony bravia" || brand === "roku";
                    const isAC = type.includes('daikin') || type.includes('gree') || type.includes("mitsubishi") || type.includes('ac') || brand === 'daikin' || brand === "gree" || brand === "mitsubishi";
                    const isPlug = type.includes('plug') || type.includes('p100') || type.includes('p110') || type.includes('p115');
                    const isSpeaker = type.includes('sonos') || brand === "Sonos"
                    const isRestricted = brand === 'shelly' || brand === 'phue' || type.includes('shelly') || type.includes('phue');
                    const showBrightness = !isTv && !isAC && !isPlug && !isRestricted;

                    const card = document.createElement('div');
                    card.className = 'card';

                    let html = `
                        <div>
                            <div class="device-name">${d.device_id}</div>
                            <div class="device-meta">${d.brand} / ${d.ip_address}</div>
                        </div>
                        <div>
                    `;

                    if (isTv) {
                        html += `
                            <div class="controls">
                                <button onclick="send('/api/tv/control', '${d.device_id}', '${d.device_type}', 'turn_on')">ON</button>
                                <button onclick="send('/api/tv/control', '${d.device_id}', '${d.device_type}', 'turn_off')">OFF</button>
                            </div>
                            <div class="controls">
                                <button onclick="send('/api/tv/control', '${d.device_id}', '${d.device_type}', 'play')">PLAY</button>
                                <button onclick="send('/api/tv/control', '${d.device_id}', '${d.device_type}', 'pause')">PAUSE</button>
                            </div>
                            <div class="controls">
                                <button onclick="send('/api/tv/control', '${d.device_id}', '${d.device_type}', 'volume_up')">VOL +</button>
                                <button onclick="send('/api/tv/control', '${d.device_id}', '${d.device_type}', 'volume_down')">VOL -</button>
                            </div>
                        `;
                    } else if (isAC) {
                        html += `
                            <div class="controls">
                                <button onclick="send('/api/air-condition/control', '${d.device_id}', '${d.device_type}', 'turn_on')">ON</button>
                                <button onclick="send('/api/air-condition/control', '${d.device_id}', '${d.device_type}', 'turn_off')">OFF</button>
                            </div>
                            <select onchange="send('/api/air-condition/control', '${d.device_id}', '${d.device_type}', 'set_mode', this.value)">
                                <option value="cool">Mode: Cool</option>
                                <option value="heat">Mode: Heat</option>
                                <option value="auto">Mode: Auto</option>
                                <option value="dry">Mode: Dry</option>
                                <option value="fan">Mode: Fan</option>
                            </select>
                            <div class="temp-picker">
                                <span>Θερμοκρασία (°C):</span>
                                <input type="number" min="16" max="32" value="24" 
                                    onchange="send('/api/air-condition/control', '${d.device_id}', '${d.device_type}', 'set_temperature', parseFloat(this.value))">
                            </div>
                            <div class="warning-text">* Unsupp: BRP069C4x fw 2.0.0</div>
                        `;
                    } else if (isSpeaker){
                        html += `
                            <div class="controls">
                                <button onclick="send('/api/speaker/control', '${d.device_id}', '${d.device_type}', 'play')">Play</button>
                                <button onclick="send('/api/speaker/control', '${d.device_id}', '${d.device_type}', 'pause')">Pause</button>
                                <button onclick="send('/api/speaker/control', '${d.device_id}', '${d.device_type}', 'stop')">Stop</button>
                                <button onclick="send('/api/speaker/control', '${d.device_id}', '${d.device_type}', 'volume_up')">Volume Up</button>
                                <button onclick="send('/api/speaker/control', '${d.device_id}', '${d.device_type}', 'volume_down')">Volume Down</button>

                            </div>
    
                            <div class="warning-text">* Unsupp: BRP069C4x fw 2.0.0</div>
                        `;
                    }  else {
                        const endpoint = isPlug ? '/api/plug/control' : '/api/light/control';
                        html += `
                            <div class="controls">
                                <button onclick="send('${endpoint}', '${d.device_id}', '${d.device_type}', 'turn_on')">ON</button>
                                <button onclick="send('${endpoint}', '${d.device_id}', '${d.device_type}', 'turn_off')">OFF</button>
                            </div>
                        `;

                        if (showBrightness) {
                            html += `
                                <input type="range" min="1" max="100" value="80" 
                                    onchange="send('${endpoint}', '${d.device_id}', '${d.device_type}', 'set_brightness', parseInt(this.value))">
                            `;
                        }
                    }

                    html += `</div>`;
                    card.innerHTML = html;
                    container.appendChild(card);
                });

            } catch (err) {
                status.innerText = 'Σφάλμα σύνδεσης';
            }
        }

        async function send(endpoint, id, type, action, val = null) {
            await fetch(endpoint, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({
                    device_id: id,
                    dev_type: type,
                    action: action,
                    value: val,
                    triggered_by: 'dashboard'
                })
            });
        }

        loadDevices();
    </script>
</body>
</html>
